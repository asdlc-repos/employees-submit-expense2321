openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:submit: Create, edit and submit the caller's own claims
            claims:withdraw: Withdraw the caller's own undecided claim
            claims:review-manager: Claims of the caller's direct reports
            claims:approve: Approve a direct report's submitted claim
            claims:reject: Reject a direct report's submitted claim
            claims:read-all: Every submitted claim in the company
            reports:read: Totals by status
            reports:export: Download the filtered claim list as CSV
            exports:read: Pending summary and past payroll batches
            exports:create: Create a payroll export batch
            exports:download: Download a payroll batch file
  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    status:
      name: status
      in: query
      description: Filter by claim status
      schema: { $ref: '#/components/schemas/ClaimStatus' }
    sort:
      name: sort
      in: query
      description: Order by submission time
      schema: { type: string, enum: [oldest, newest] }
    claimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    exportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The claim is not in a state that allows this, or it changed since it was read
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    ClaimStatus:
      type: string
      enum: [draft, submitted, approved, rejected, withdrawn]
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CategoryPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    LineInput:
      type: object
      required: [expenseDate, amountCents, categoryId, description]
      properties:
        expenseDate: { type: string, format: date }
        amountCents: { type: integer, minimum: 1, description: Amount in cents of the company currency }
        categoryId: { type: string }
        description: { type: string }
    ClaimLine:
      allOf:
        - $ref: '#/components/schemas/LineInput'
        - type: object
          required: [id, categoryName]
          properties:
            id: { type: string, format: uuid }
            categoryName: { type: string }
    ClaimInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineInput' }
    Claim:
      type: object
      required: [id, employeeUsername, employeeName, status, version, totalCents, lines]
      properties:
        id: { type: string, format: uuid }
        employeeUsername: { type: string }
        employeeName: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        version: { type: integer, description: Increases on every change; used to detect a claim that changed under a reviewer }
        totalCents: { type: integer, description: Sum of line amounts in cents }
        submittedAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        payrollExportId: { type: string, format: uuid, nullable: true, description: Set once the claim is in a payroll batch }
        lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
    ClaimSummary:
      type: object
      required: [id, employeeName, status, totalCents, lineCount]
      properties:
        id: { type: string, format: uuid }
        employeeName: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        totalCents: { type: integer }
        lineCount: { type: integer }
        submittedAt: { type: string, format: date-time, nullable: true }
        payrollExportId: { type: string, format: uuid, nullable: true }
    ClaimPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
    ApproveRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: Version of the claim the manager saw }
    RejectRequest:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer }
        reason: { type: string, minLength: 1 }
    StatusTotal:
      type: object
      required: [status, claimCount, totalCents]
      properties:
        status: { $ref: '#/components/schemas/ClaimStatus' }
        claimCount: { type: integer }
        totalCents: { type: integer }
    StatusTotalPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        data: { type: array, items: { $ref: '#/components/schemas/StatusTotal' } }
    PendingExport:
      type: object
      required: [claimCount, totalCents]
      properties:
        claimCount: { type: integer, description: Approved claims not yet exported }
        totalCents: { type: integer }
    PayrollExport:
      type: object
      required: [id, createdAt, createdBy, claimCount, totalCents]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        claimCount: { type: integer }
        totalCents: { type: integer }
    PayrollExportPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/PayrollExport' } }
security:
  - oauth2: []
paths:
  /categories:
    get:
      operationId: listCategories
      summary: The fixed list of expense categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's claims
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The caller's claims with status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMyClaim
      summary: Create a draft claim for the caller
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/claimId'
    get:
      operationId: getMyClaim
      summary: One of the caller's claims, with rejection reason if any
      security:
        - oauth2: [claims:read]
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateMyClaim
      summary: Replace the lines of the caller's draft, submitted or rejected claim
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/claims/{claimId}/submit:
    post:
      operationId: submitMyClaim
      summary: Submit (or resubmit) the caller's claim to their line manager
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: Claim submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/claims/{claimId}/withdraw:
    post:
      operationId: withdrawMyClaim
      summary: Withdraw the caller's undecided claim
      security:
        - oauth2: [claims:withdraw]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: Claim withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/team/claims:
    get:
      operationId: listTeamClaims
      summary: Claims of the caller's direct reports, drafts excluded
      security:
        - oauth2: [claims:review-manager]
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Team claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/team/claims/{claimId}:
    get:
      operationId: getTeamClaim
      summary: A direct report's claim in its current state
      security:
        - oauth2: [claims:review-manager]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: The claim with its lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/claims/{claimId}/approve:
    post:
      operationId: approveTeamClaim
      summary: Approve a direct report's submitted claim
      security:
        - oauth2: [claims:approve]
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: Claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/team/claims/{claimId}/reject:
    post:
      operationId: rejectTeamClaim
      summary: Reject a direct report's submitted claim with a reason
      security:
        - oauth2: [claims:reject]
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims:
    get:
      operationId: listAllClaims
      summary: Every submitted claim in the company, newest first, drafts excluded
      security:
        - oauth2: [claims:read-all]
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: All claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /claims/{claimId}:
    get:
      operationId: getClaim
      summary: Any submitted claim with lines, status and decision
      security:
        - oauth2: [claims:read-all]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/claim-totals:
    get:
      operationId: listClaimTotals
      summary: Number of claims and total amount for each status
      security:
        - oauth2: [reports:read]
      responses:
        '200':
          description: Totals by status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusTotalPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/claims.csv:
    get:
      operationId: exportClaimsReport
      summary: The claim list, optionally filtered by status, as CSV
      security:
        - oauth2: [reports:export]
      parameters:
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payroll-exports/pending:
    get:
      operationId: getPendingPayrollExport
      summary: Count and total of approved claims waiting to be exported
      security:
        - oauth2: [exports:read]
      responses:
        '200':
          description: Pending summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payroll-exports:
    get:
      operationId: listPayrollExports
      summary: Past export batches, newest first
      security:
        - oauth2: [exports:read]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollExportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPayrollExport
      summary: Export every approved, not-yet-exported claim as one batch
      security:
        - oauth2: [exports:create]
      responses:
        '201':
          description: Batch created and its claims marked exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payroll-exports/{exportId}/file:
    get:
      operationId: downloadPayrollExport
      summary: The CSV file of a batch, one row per claim (employee, claim ID, approval date, total)
      security:
        - oauth2: [exports:download]
      parameters:
        - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
